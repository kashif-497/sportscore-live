<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SportScore Live — Live Scores, Standings & Stats</title>
<meta name="description" content="Real-time scores, standings, top scorers and player stats for football, basketball, cricket and tennis." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
<style>
/* ============================================================
   THEME
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#070c16;
  --panel:#101b2d;
  --panel2:#16233a;
  --line:#1d2b45;
  --text:#e9effb;
  --muted:#7d8ca6;
  --accent:#2ee6a8;
  --blue:#4da3ff;
  --amber:#ffb74d;
  --red:#ff4d5e;
  --r:14px;
  --shadow:0 14px 34px -12px #000a;
}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -12%, #12305a66, transparent 60%),
    radial-gradient(900px 520px at 92% -6%, #1c5c4a44, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit}
::selection{background:#2ee6a844}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#22334f;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#2f4468}

/* ============================================================
   HEADER
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:60;
  background:#070c16d9;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1260px;margin:0 auto;padding:11px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.02rem;white-space:nowrap;user-select:none}
.brand .mark{
  width:28px;height:28px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--blue));
  display:grid;place-items:center;font-size:.85rem;color:#04121f;
  box-shadow:0 0 22px #2ee6a855;
}
.brand span.sub{color:var(--muted);font-weight:600;font-size:.78rem}

.sports{
  display:flex;gap:4px;background:var(--panel);padding:4px;
  border-radius:999px;border:1px solid var(--line);
}
.sports button{
  border:0;background:transparent;color:var(--muted);
  font-size:.85rem;font-weight:600;line-height:1;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.16s;
  white-space:nowrap;
}
.sports button:hover{color:var(--text);background:#ffffff08}
.sports button.on{
  background:var(--panel2);color:var(--text);
  box-shadow:0 0 0 1px #2b4a7580 inset, 0 4px 14px -6px #000;
}
.sports .ico{font-size:.95rem;line-height:1}

.search{flex:1 1 200px;min-width:160px;position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);
  color:var(--text);padding:10px 14px 10px 34px;border-radius:10px;
  font-size:.87rem;font-weight:500;outline:none;transition:.16s;
}
.search input::placeholder{color:#5c6b83}
.search input:focus{border-color:#2f5486;box-shadow:0 0 0 3px #4da3ff22;background:#0e1828}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#5c6b83;font-size:.85rem;pointer-events:none}

/* ============================================================
   LAYOUT
   ============================================================ */
main{max-width:1260px;margin:0 auto;padding:20px 20px 70px}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:11px}
.seg button{
  border:0;background:transparent;color:var(--muted);
  font-size:.83rem;font-weight:600;padding:8px 14px;border-radius:8px;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 2px 10px -4px #000}

.combo{position:relative}
.combo select{
  appearance:none;-webkit-appearance:none;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:10px 34px 10px 14px;border-radius:11px;font-size:.83rem;font-weight:600;
  cursor:pointer;outline:none;transition:.15s;
}
.combo select:focus{border-color:#2f5486;box-shadow:0 0 0 3px #4da3ff22}
.combo::after{
  content:'';position:absolute;right:13px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;
}
.spacer{flex:1}

.status{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.status .beat{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent);animation:pulse 2s infinite}
.status.warn .beat{background:var(--amber);box-shadow:0 0 9px var(--amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.btn-refresh{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:.95rem;
  display:grid;place-items:center;transition:.15s;flex:none;
}
.btn-refresh:hover{color:var(--text);border-color:#2f5486;background:var(--panel2)}
.btn-refresh.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   MATCH GRID
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:14px}

.card{
  position:relative;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,var(--panel),#0d1626 90%);
  border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px 11px;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px);border-color:#31558a;box-shadow:var(--shadow)}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:transparent;transition:.18s;
}
.card.live::before{background:var(--red)}
.card.live{border-color:#3a2130}
.card.live:hover{border-color:#5c2b3c}

.card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.comp{
  flex:1;font-size:.7rem;font-weight:700;letter-spacing:.045em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip{
  font-size:.66rem;font-weight:800;line-height:1;padding:5px 8px;border-radius:6px;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;flex:none;
}
.chip.live{background:#ff4d5e1c;color:var(--red);display:inline-flex;align-items:center;gap:5px}
.chip.live i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.3s infinite}
.chip.done{background:#ffffff0f;color:#93a2ba}
.chip.soon{background:#4da3ff1a;color:var(--blue)}

.team{display:flex;align-items:center;gap:10px;padding:5px 0}
.logo{
  width:27px;height:27px;border-radius:50%;flex:none;overflow:hidden;
  background:var(--panel2);display:grid;place-items:center;
  font-size:.64rem;font-weight:800;color:#8ea0bb;letter-spacing:.02em;
  border:1px solid #22334f;
}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.team .name{
  flex:1;font-size:.9rem;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.team .sc{
  font-size:1.02rem;font-weight:800;font-variant-numeric:tabular-nums;
  min-width:22px;text-align:right;letter-spacing:-.01em;
}
.team.win .name,.team.win .sc{color:#fff}
.team.lose .name,.team.lose .sc{color:#7f8ea6}

.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:9px;padding-top:9px;border-top:1px solid #1a2740;
  font-size:.72rem;color:var(--muted);font-weight:500;
}
.card-foot .go{opacity:0;transition:.18s;color:var(--blue);font-weight:700}
.card:hover .card-foot .go{opacity:1}

/* ============================================================
   TABLES
   ============================================================ */
.panel{
  background:linear-gradient(180deg,var(--panel),#0d1626);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.panel-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 16px;border-bottom:1px solid var(--line);
}
.panel-head h2{margin:0;font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.panel-head .hint{font-size:.74rem;color:var(--muted);font-weight:500}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:520px}
thead th{
  text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
  padding:11px 14px;background:#0c1524;border-bottom:1px solid var(--line);
  position:sticky;top:0;white-space:nowrap;
}
thead th.num,tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody td{padding:11px 14px;border-bottom:1px solid #16223a;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#ffffff06}
td.rank{font-weight:800;color:var(--muted);width:44px}
td.team-cell{display:flex;align-items:center;gap:9px;font-weight:600;min-width:170px}
td.team-cell .logo{width:22px;height:22px;font-size:.58rem}
td.pts{font-weight:800;color:var(--accent)}
.pos-bar{
  display:inline-block;width:3px;height:16px;border-radius:2px;
  vertical-align:middle;margin-right:8px;background:transparent;
}
.pos-ucl{background:var(--blue)}
.pos-uel{background:var(--amber)}
.pos-rel{background:var(--red)}

/* ============================================================
   STATES
   ============================================================ */
.empty{
  grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--muted);
}
.empty .big{font-size:2.2rem;margin-bottom:12px;opacity:.7}
.empty h3{margin:0 0 6px;color:var(--text);font-size:1rem}
.empty p{margin:0;font-size:.85rem}

.skel{
  height:158px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(100deg,#101b2d 30%,#17253c 50%,#101b2d 70%);
  background-size:200% 100%;animation:shim 1.3s infinite linear;
}
@keyframes shim{to{background-position:-200% 0}}

.banner{
  display:flex;align-items:center;gap:10px;
  background:#ffb74d14;border:1px solid #ffb74d33;color:#ffcf8a;
  padding:10px 14px;border-radius:11px;font-size:.8rem;font-weight:500;
  margin-bottom:16px;
}
.banner b{color:var(--amber)}

/* ============================================================
   MODAL
   ============================================================ */
.modal-bg{
  position:fixed;inset:0;z-index:100;background:#03060cd9;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{
  width:min(620px,100%);max-height:86vh;overflow:auto;
  background:linear-gradient(180deg,#111c2e,#0c1524);
  border:1px solid #25395c;border-radius:18px;
  box-shadow:0 30px 80px -20px #000;
  transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.3,1);
}
.modal-bg.open .modal{transform:none}
.modal-head{
  display:flex;align-items:flex-start;gap:12px;
  padding:18px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#111c2ef2;backdrop-filter:blur(8px);z-index:2;
}
.modal-head .t{flex:1;min-width:0}
.modal-head .t .comp{font-size:.7rem;margin-bottom:5px;display:block}
.modal-head h2{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.modal-close{
  border:1px solid var(--line);background:var(--panel2);color:var(--muted);
  width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:1rem;flex:none;
  display:grid;place-items:center;transition:.15s;
}
.modal-close:hover{color:var(--text);border-color:#3a5c8f}
.modal-body{padding:18px 20px 22px}

.scoreboard{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
  padding:20px 14px;border-radius:14px;
  background:radial-gradient(400px 160px at 50% 0%,#1d3a5f55,transparent),#0e1828;
  border:1px solid var(--line);margin-bottom:18px;
}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;min-width:0}
.sb-team .logo{width:48px;height:48px;font-size:.95rem}
.sb-team .nm{font-size:.86rem;font-weight:700;line-height:1.25;word-break:break-word}
.sb-score{
  font-size:2rem;font-weight:900;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1;
}
.sb-score .dash{color:#3d4f6b;margin:0 5px;font-weight:400}
.sb-meta{grid-column:1/-1;text-align:center;font-size:.76rem;color:var(--muted);font-weight:600}

.sec-title{
  font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:20px 0 10px;
}
.sec-title:first-child{margin-top:0}

.events{display:flex;flex-direction:column;gap:2px}
.ev{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;
  font-size:.83rem;transition:background .12s;
}
.ev:hover{background:#ffffff07}
.ev .min{
  font-size:.72rem;font-weight:800;color:var(--muted);min-width:38px;
  font-variant-numeric:tabular-nums;flex:none;
}
.ev .ic{font-size:.95rem;flex:none;width:20px;text-align:center}
.ev .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .txt small{color:var(--muted);font-weight:500}

.lineups{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lineups h4{
  margin:0 0 8px;font-size:.78rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;
}
.lineups ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lineups li{
  font-size:.83rem;padding:6px 9px;border-radius:7px;background:#ffffff05;
  display:flex;align-items:center;gap:8px;
}
.lineups li .no{
  font-size:.68rem;font-weight:800;color:var(--muted);min-width:18px;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   FOOTER
   ============================================================ */
footer{border-top:1px solid var(--line);background:#060a12;margin-top:20px}
.foot-inner{
  max-width:1260px;margin:0 auto;padding:30px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.foot-inner p{margin:0;font-size:.78rem;color:var(--muted);line-height:1.6;max-width:560px}
.foot-links{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem}
.foot-links a{color:var(--muted);text-decoration:none;transition:.15s}
.foot-links a:hover{color:var(--text)}

.attr-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid #16223a;
  font-size:.78rem;color:var(--muted);
}
.attr-row a{text-decoration:none;font-weight:600;color:#c7d5ea}
.attr-row a:hover{color:#fff}

@media (max-width:720px){
  .topbar-inner{padding:10px 14px;gap:10px}
  .brand span.sub{display:none}
  .sports{order:3;width:100%;justify-content:space-between}
  .sports button{flex:1;justify-content:center;padding:9px 6px}
  .sports button .lbl{font-size:.76rem}
  main{padding:16px 14px 60px}
  .grid{grid-template-columns:1fr}
  .scoreboard{grid-template-columns:1fr auto 1fr;gap:8px;padding:16px 8px}
  .sb-score{font-size:1.6rem}
  .lineups{grid-template-columns:1fr}
  .foot-inner{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="mark">⚡</div>
      <div>SportScore <span class="sub">Live</span></div>
    </div>

    <nav class="sports" id="sportsNav" aria-label="Sport"></nav>

    <div class="search">
      <span class="mag">🔍</span>
      <input id="searchInput" type="search" placeholder="Search teams, competitions…" autocomplete="off" aria-label="Search" />
    </div>

    <button class="btn-refresh" id="refreshBtn" title="Refresh now" aria-label="Refresh">⟳</button>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main>
  <div id="banner"></div>

  <div class="toolbar">
    <div class="seg" id="viewSeg" role="tablist">
      <button data-view="matches" class="on" role="tab">Matches</button>
      <button data-view="standings" role="tab">Standings</button>
      <button data-view="scorers" role="tab">Top Scorers</button>
    </div>

    <div class="combo" id="compWrap" hidden>
      <select id="compSelect" aria-label="Competition"></select>
    </div>

    <div class="spacer"></div>

    <div class="status" id="statusBox">
      <span class="beat"></span><span id="statusText">Connecting…</span>
    </div>
  </div>

  <div id="viewMatches" class="grid"></div>
  <div id="viewStandings" hidden></div>
  <div id="viewScorers" hidden></div>
</main>

<!-- ================= FOOTER ================= -->
<footer>
  <div class="foot-inner">
    <div>
      <p>
        Real-time scores, standings and statistics for football, basketball, cricket and tennis
        across hundreds of leagues worldwide. Data served by the free
        <a href="https://sportscore.com/" rel="dofollow" style="color:#c7d5ea;font-weight:600">SportScore</a> REST API.
      </p>
      <div class="attr-row">
        <span>© <span id="yr"></span> SportScore Live — demo interface.</span>
        <!-- Required attribution badge -->
        <a href="https://sportscore.com/" rel="dofollow" title="Sports data by SportScore"
           style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:#0a1e3d;color:#fff;border-radius:4px;text-decoration:none;font:600 .88rem system-ui,-apple-system,sans-serif;">Powered by SportScore</a>
      </div>
    </div>
    <div class="foot-links">
      <a href="https://sportscore.com/" rel="dofollow">SportScore</a>
      <a href="https://sportscore.com/api/widget/matches/?sport=football&limit=10" rel="dofollow">API</a>
      <a href="https://github.com/Backspace-me/sportscore-mcp" rel="dofollow">MCP Server</a>
    </div>
  </div>
</footer>

<!-- ================= MODAL ================= -->
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="t">
        <span class="comp" id="modalComp"></span>
        <h2 id="modalTitle">Match</h2>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   1. CONFIG
   ============================================================ */
const API_BASE = "https://sportscore.com/api/widget";

/* Self-identify so SportScore can see us in their referer analytics. */
const SRC = (() => {
  try {
    const h = location.hostname;
    return h && h !== "localhost" && h !== "127.0.0.1" ? h : "sportscore-live-demo";
  } catch { return "sportscore-live-demo"; }
})();

const SPORTS = [
  { id: "football",   label: "Football",   icon: "⚽" },
  { id: "basketball", label: "Basketball", icon: "🏀" },
  { id: "cricket",    label: "Cricket",    icon: "🏏" },
  { id: "tennis",     label: "Tennis",     icon: "🎾" },
];

const COMPETITIONS = {
  football: [
    { slug: "premier-league",             name: "Premier League" },
    { slug: "la-liga",                    name: "La Liga" },
    { slug: "serie-a",                    name: "Serie A" },
    { slug: "bundesliga",                 name: "Bundesliga" },
    { slug: "ligue-1",                    name: "Ligue 1" },
    { slug: "uefa-champions-league",      name: "UEFA Champions League" },
    { slug: "uefa-europa-league",         name: "UEFA Europa League" },
    { slug: "fifa-world-cup",             name: "FIFA World Cup" },
  ],
  basketball: [
    { slug: "nba",              name: "NBA" },
    { slug: "euroleague",       name: "EuroLeague" },
    { slug: "acb-spain",        name: "ACB Spain" },
    { slug: "nbb-brazil",       name: "NBB Brazil" },
    { slug: "cba-china",        name: "CBA China" },
  ],
  cricket: [
    { slug: "ipl",                  name: "IPL" },

/* ============================================================
   3. UTILITIES
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/** First defined, non-null, non-empty value. */
function first(...vals) {
  for (const v of vals) {
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return undefined;
}

/** Deep lookup: val(obj, ["team.name", "name"]) */
function val(obj, keys) {
  for (const k of keys) {
    const v = k.split(".").reduce((o, p) => (o == null ? undefined : o[p]), obj);
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return undefined;
}

/** Find the most likely array inside an unknown API response shape. */
function pickArray(obj, keys, depth = 0) {
  if (Array.isArray(obj)) return obj;
  if (!obj || typeof obj !== "object" || depth > 4) return [];
  for (const k of keys) if (Array.isArray(obj[k])) return obj[k];
  for (const k of keys) {
    if (obj[k] && typeof obj[k] === "object") {
      const r = pickArray(obj[k], keys, depth + 1);
      if (r.length) return r;
    }
  }
  for (const v of Object.values(obj)) if (Array.isArray(v) && v.length) return v;
  return [];
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function initials(name) {
  const parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function fmtTime(isoStr) {
  if (!isoStr) return "TBD";
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return "TBD";
  const sameDay = d.toDateString() === new Date().toDateString();
  return d.toLocaleString(undefined, sameDay
    ? { hour: "2-digit", minute: "2-digit" }
    : { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* ============================================================
   4. NORMALISERS
   ============================================================ */
function normTeam(t) {
  if (t == null) return { name: "TBD", logo: null, score: null };
  if (typeof t === "string") return { name: t, logo: null, score: null };
  return {
    name: first(t.name, t.shortName, t.short_name, t.displayName, t.title, t.teamName, "TBD"),
    logo: first(t.logo, t.logoUrl, t.image, t.crest, t.badge, t.icon, null),
    score: first(t.score, t.goals, t.points, t.runs, t.sets, t.value, null),
  };
}

function normMatch(m) {
  if (!m || typeof m !== "object") return null;

  const teams = m.teams || {};
  const home = normTeam(first(m.home, m.homeTeam, m.home_team, teams.home, m.localTeam));
  const away = normTeam(first(m.away, m.awayTeam, m.away_team, teams.away, m.visitorTeam));

  // Scores sometimes live at match level
  if (home.score == null) home.score = first(m.homeScore, m.home_score, m.score?.home, m.goalsHome, null);
  if (away.score == null) away.score = first(m.awayScore, m.away_score, m.score?.away, m.goalsAway, null);

  const statusRaw = String(first(m.status, m.state, m.matchStatus, m.statusText, "")).toLowerCase();
  const isLive = m.isLive === true || m.live === true ||
    /live|in.?play|progress|1st|2nd|half|h\.?t\.?|inning|set\s?\d|q[1-4]|period|break/.test(statusRaw);
  const isFinished = !isLive && (
    m.finished === true ||
    /finish|ended|full.?time|complete|result|final|post|^ft$|^aet$|^pen$/.test(statusRaw));

  let clock = first(m.minute, m.clock, m.period, m.displayTime, m.statusShort, null);
  if (typeof clock === "number" && clock > 1000) clock = null;   // looks like a timestamp
  if (clock && typeof clock === "object") clock = first(clock.display, clock.short, clock.minute, null);
  if (isFinished && !clock) clock = "FT";

  const rawStart = first(m.startTime, m.start_time, m.kickoff, m.utcDate, m.date, m.scheduled, m.startDate, null);
  const startTime = (typeof rawStart === "string" || typeof rawStart === "number") ? rawStart : null;

  const comp = first(
    m.competition?.name, m.league?.name, m.tournament?.name, m.series?.name,
    m.competitionName, m.leagueName, m.competition, m.league, ""
  );

  return {
    slug: first(m.slug, m.id, m.matchId, m.uuid, null),
    competition: typeof comp === "object" ? first(comp.name, "") : comp,
    home, away,
    isLive, isFinished,
    clock: clock ? String(clock) : null,
    startTime,
    venue: first(m.venue?.name, m.venue, m.stadium, null),
    raw: m,
  };
}

/* ============================================================
   5. API LAYER
   ============================================================ */
async function api(path, params = {}) {
  const url = new URL(`${API_BASE}${path}/`);
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  }
  url.searchParams.set("src", SRC);

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(url.toString(), {
      signal: ctrl.signal,
      headers: { Accept: "application/json" },
      mode: "cors",
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ============================================================
   8. DATA LOADING
   ============================================================ */
async function loadMatches() {
  state.loading = true;
  renderMatches();

  try {
    const data = await api("matches", { sport: state.sport, limit: 50 });
    const arr = pickArray(data, ["matches", "data", "results", "fixtures", "games", "items"]);
    const list = arr.map(normMatch).filter(Boolean);

    if (!list.length) throw new Error("empty payload");

    state.matches = list;
    state.usingDemo = false;
    showBanner("");
    setStatus(`Live · updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
  } catch (err) {
    console.warn("[SportScore] falling back to demo data:", err.message);
    state.matches = (DEMO[state.sport] || []).map(normMatch).filter(Boolean);
    state.usingDemo = true;
    setStatus("Demo data (API unreachable)", true);
    showBanner(
      `<div class="banner">⚠️ <span><b>Live API unavailable from this browser</b> — showing sample data. ` +
      `If you opened this file directly, serve it over http(s) or check your network / CORS.</span></div>`
    );
  } finally {
    state.loading = false;
    state.lastUpdated = new Date();
    renderMatches();
  }
}

async function loadStandings() {
  const key = `${state.sport}:${state.competition}`;
  if (cache.standings.has(key)) { renderStandings(cache.standings.get(key)); return; }

  renderStandings(null, true);
  try {
    const data = await api("standings", { sport: state.sport, slug: state.competition });
    const rows = pickArray(data, ["standings", "table", "data", "rows", "groups", "entries"]);
    cache.standings.set(key, rows);
    renderStandings(rows);
    setStatus("Standings loaded");
  } catch (err) {
    renderStandings([], false, err.message);
    setStatus("Couldn't load standings", true);
  }
}

async function loadScorers() {
  const key = `${state.sport}:${state.competition}`;
  if (cache.scorers.has(key)) { renderScorers(cache.scorers.get(key)); return; }

  renderScorers(null, true);
  try {
    const data = await api("topscorers", {
      sport: state.sport, slug: state.competition, limit: 25, stat: "goals",
    });
    const rows = pickArray(data, ["scorers", "topscorers", "topScorers", "data", "players", "leaders"]);
    cache.scorers.set(key, rows);
    renderScorers(rows);
    setStatus("Top scorers loaded");
  } catch (err) {
    renderScorers([], false, err.message);
    setStatus("Couldn't load scorers", true);
  }
}

   ============================================================ */
function teamLogoHTML(team) {
  if (team.logo) {
    return `<span class="logo"><img src="${esc(team.logo)}" alt="" loading="lazy"
              onerror="this.parentNode.textContent='${esc(initials(team.name))}'"></span>`;
  }
  return `<span class="logo">${esc(initials(team.name))}</span>`;
}

function statusChip(m) {
  if (m.isLive) {
    return `<span class="chip live"><i></i>${esc(m.clock || "LIVE")}</span>`;
  }
  if (m.isFinished) {
    return `<span class="chip done">${esc(m.clock && m.clock !== "FT" ? m.clock : "FT")}</span>`;
  }
  return `<span class="chip soon">${esc(fmtTime(m.startTime))}</span>`;
}

function matchCardHTML(m, i) {
  const hs = m.home.score, as = m.away.score;
  const hasScore = hs != null || as != null;
  const homeWin = m.isFinished && hasScore && Number(hs) > Number(as);
  const awayWin = m.isFinished && hasScore && Number(as) > Number(hs);

  return `
  <article class="card ${m.isLive ? "live" : ""}" data-idx="${i}" tabindex="0"
           role="button" aria-label="${esc(m.home.name)} versus ${esc(m.away.name)}">
    <div class="card-top">
      <span class="comp">${esc(m.competition || "—")}</span>
      ${statusChip(m)}
    </div>

    <div class="team ${homeWin ? "win" : awayWin ? "lose" : ""}">
      ${teamLogoHTML(m.home)}
      <span class="name">${esc(m.home.name)}</span>
      <span class="sc">${hasScore && hs != null ? esc(hs) : "–"}</span>
    </div>

    <div class="team ${awayWin ? "win" : homeWin ? "lose" : ""}">
      ${teamLogoHTML(m.away)}
      <span class="name">${esc(m.away.name)}</span>
      <span class="sc">${hasScore && as != null ? esc(as) : "–"}</span>
    </div>

    <div class="card-foot">
      <span>${esc(m.isLive ? "In progress" : m.isFinished ? "Full time" : fmtTime(m.startTime))}</span>
      <span class="go">Details →</span>
    </div>
  </article>`;
}

function renderMatches() {
  const box = $("#viewMatches");

  if (state.loading) {
    box.innerHTML = Array.from({ length: 6 }, () => `<div class="skel"></div>`).join("");
    return;
  }

  let list = state.matches;
  const q = state.search.trim().toLowerCase();
  if (q) {
    list = list.filter((m) =>
      m.home.name.toLowerCase().includes(q) ||
      m.away.name.toLowerCase().includes(q) ||
      (m.competition || "").toLowerCase().includes(q)
    );
  }

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        <div class="big">🔍</div>
        <h3>No matches found</h3>
        <p>${q ? `Nothing matches “${esc(state.search)}”.` : "No fixtures available for this sport right now."}</p>
      </div>`;
    return;
  }

  box.innerHTML = list.map(matchCardHTML).join("");

  // Delegated click / keyboard
  box.onclick = (e) => {
    const card = e.target.closest(".card");
    if (card) openMatch(list[+card.dataset.idx]);
  };
  box.onkeydown = (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const card = e.target.closest(".card");
    if (card) { e.preventDefault(); openMatch(list[+card.dataset.idx]); }
  };
}

   ============================================================ */
function renderStandings(rows, loading = false, error = null) {
  const box = $("#viewStandings");
  const compName = (COMPETITIONS[state.sport] || []).find((c) => c.slug === state.competition)?.name || "";

  if (loading) {
    box.innerHTML = `<div class="panel"><div class="panel-head"><h2>Loading standings…</h2></div>
      <div style="padding:16px">${'<div class="skel" style="height:44px;margin-bottom:8px"></div>'.repeat(8)}</div></div>`;
    return;
  }

  if (error || !rows || !rows.length) {
    box.innerHTML = `
      <div class="panel">
        <div class="panel-head"><h2>${esc(compName)} — Standings</h2></div>
        <div class="empty">
          <div class="big">📊</div>
          <h3>No standings available</h3>
          <p>${error ? "Couldn't reach the standings endpoint for this competition." : "This competition has no table data."}</p>
        </div>
      </div>`;
    return;
  }

  const body = rows.map((r, i) => {
    const pos = val(r, ["position", "pos", "rank", "place", "index"]) ?? i + 1;
    const team = val(r, ["team.name", "teamName", "name", "team", "shortName"]) ?? "—";
    const logo = val(r, ["team.logo", "logo", "team.image", "crest"]);
    const played = val(r, ["played", "matches", "playedGames", "gamesPlayed", "p", "P"]) ?? "–";
    const win = val(r, ["won", "wins", "win", "w"]) ?? "–";
    const draw = val(r, ["drawn", "draws", "draw", "d", "ties"]) ?? "–";
    const loss = val(r, ["lost", "losses", "loss", "l"]) ?? "–";
    const gd = val(r, ["goalDifference", "goalsDiff", "gd", "difference", "goalDiff", "pointsDiff"]) ?? "–";
    const pts = val(r, ["points", "pts", "point", "Pts", "score"]) ?? "–";

    const p = Number(pos);
    const bar = p <= 4 ? "pos-ucl" : p <= 6 ? "pos-uel" : (rows.length - p < 3 ? "pos-rel" : "");

    const logoHTML = logo
      ? `<span class="logo"><img src="${esc(logo)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${esc(initials(team))}'"></span>`
      : `<span class="logo">${esc(initials(team))}</span>`;

    return `<tr>
      <td class="rank"><span class="pos-bar ${bar}"></span>${esc(pos)}</td>
      <td><div class="team-cell">${logoHTML}<span>${esc(team)}</span></div></td>
      <td class="num">${esc(played)}</td>
      <td class="num">${esc(win)}</td>
      <td class="num">${esc(draw)}</td>
      <td class="num">${esc(loss)}</td>
      <td class="num">${esc(gd)}</td>
      <td class="num pts">${esc(pts)}</td>
    </tr>`;
  }).join("");

  box.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${esc(compName)}</h2>
        <span class="hint">Standings</span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Team</th>
            <th class="num">P</th><th class="num">W</th><th class="num">D</th>
            <th class="num">L</th><th class="num">GD</th><th class="num">Pts</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

    <div class="panel">
      <div class="panel-head">
        <h2>${esc(compName)}</h2>
        <span class="hint">Top scorers</span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Player</th><th>Team</th>
            <th class="num">Apps</th><th class="num">Assists</th><th class="num">Goals</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

/* ============================================================
   12. RENDER DISPATCHER
   ============================================================ */
function render() {
  $("#viewMatches").hidden = state.view !== "matches";
  $("#viewStandings").hidden = state.view !== "standings";
  $("#viewScorers").hidden = state.view !== "scorers";

  if (state.view === "matches") loadMatches();
  else if (state.view === "standings") loadStandings();
  else loadScorers();
}

/* ============================================================
   13. MATCH DETAIL MODAL
   ============================================================ */
const modalBg = $("#modalBg");

function closeModal() {
  modalBg.classList.remove("open");
  document.body.style.overflow = "";
}

async function openMatch(m) {
  if (!m) return;

  $("#modalComp").textContent = m.competition || "";
  $("#modalTitle").textContent = `${m.home.name} vs ${m.away.name}`;
  $("#modalBody").innerHTML = scoreboardHTML(m) + `<div class="skel" style="height:120px;margin-top:18px"></div>`;
  modalBg.classList.add("open");
  document.body.style.overflow = "hidden";
  $("#modalClose").focus();

  if (!m.slug) return;

  try {
    const data = await api("match", { sport: state.sport, slug: m.slug });
    const detail = data?.match || data?.data || data;

    // Merge any richer score data back in
    const merged = normMatch({ ...(detail || {}), ...(m.raw || {}) });
    const finalMatch = (merged && merged.home.name !== "TBD") ? merged : m;

    $("#modalBody").innerHTML =
      scoreboardHTML(finalMatch) + detailSectionsHTML(detail, finalMatch);
  } catch (err) {
    $("#modalBody").innerHTML =
      scoreboardHTML(m) +
      `<p style="color:var(--muted);font-size:.85rem;margin:16px 0 0">
         Detailed data isn't available for this match right now.
       </p>`;
  }
}

function scoreboardHTML(m) {
  const hs = m.home.score, as = m.away.score;
  const hasScore = hs != null || as != null;

  const meta = m.isLive
    ? `LIVE · ${esc(m.clock || "")}`
    : m.isFinished ? "Full time" : fmtTime(m.startTime);

  return `
    <div class="scoreboard">
      <div class="sb-team">
        ${teamLogoHTML(m.home)}
        <div class="nm">${esc(m.home.name)}</div>
      </div>

      <div class="sb-score">
        ${hasScore
          ? `${esc(hs ?? 0)}<span class="dash">–</span>${esc(as ?? 0)}`
          : `<span style="font-size:1rem;color:var(--muted);font-weight:600">vs</span>`}
      </div>

      <div class="sb-team">
        ${teamLogoHTML(m.away)}
        <div class="nm">${esc(m.away.name)}</div>
      </div>

      <div class="sb-meta">${meta}${m.venue ? ` · ${esc(m.venue)}` : ""}</div>
    </div>`;
}

function detailSectionsHTML(detail, m) {
  if (!detail || typeof detail !== "object") return "";
  let html = "";

  /* --- Events / timeline --- */
  const events = pickArray(detail, ["events", "timeline", "incidents", "moments", "commentary", "actions"]);
  if (events.length) {
    const items = events.slice(0, 25).map((ev) => {
      const minute = val(ev, ["minute", "time", "min", "clock", "period"]) ?? "";
      const type = String(val(ev, ["type", "eventType", "kind", "incidentType"]) ?? "").toLowerCase();
      const player = val(ev, ["player.name", "playerName", "player", "scorer", "name"]) ?? "";
      const teamName = val(ev, ["team.name", "teamName", "team"]) ?? "";
      const text = val(ev, ["text", "description", "detail", "comment"]) ?? "";

      const icon =
        /goal|score|try|touchdown|basket/.test(type) ? "⚽" :
        /yellow|card/.test(type) ? "🟨" :
        /red/.test(type) ? "🟥" :
        /sub/.test(type) ? "🔁" :
        /penalty|foul/.test(type) ? "⚠️" :
        /start|kick.?off|begin/.test(type) ? "🟢" :
        /end|full.?time|finish/.test(type) ? "🔴" : "•";

      const label = player && teamName ? `${player} <small>(${teamName})</small>`
                  : player || text || type || "Event";

      return `<div class="ev">
        <span class="min">${esc(minute)}</span>
        <span class="ic">${icon}</span>
        <span class="txt">${esc(label).replace(/&lt;small&gt;.*?&lt;\/small&gt;/g, "")}</span>
      </div>`;
    }).join("");

    html += `<div class="sec-title">Timeline</div><div class="events">${items}</div>`;
  }

  /* --- Lineups --- */
  const lineups = detail.lineups || detail.lineup || detail.squads;
  if (lineups && typeof lineups === "object") {
    const side = (obj) => {
      const arr = Array.isArray(obj) ? obj : pickArray(obj, ["players", "startXI", "starting", "lineup", "xi"]);
      if (!arr.length) return "";
      return `<ul>${arr.slice(0, 14).map((p) => {
        const num = val(p, ["number", "shirtNumber", "jersey", "no"]) ?? "";
        const nm = val(p, ["name", "player.name", "playerName", "fullName"]) ?? "—";
        return `<li>${num !== "" ? `<span class="no">${esc(num)}</span>` : ""}${esc(nm)}</li>`;
      }).join("")}</ul>`;
    };
    const homeList = side(lineups.home || lineups.local || lineups.homeTeam);
    const awayList = side(lineups.away || lineups.visitor || lineups.awayTeam);

    if (homeList || awayList) {
      html += `<div class="sec-title">Lineups</div>
        <div class="lineups">
          <div><h4>${esc(m.home.name)}</h4>${homeList || '<p style="color:var(--muted);font-size:.8rem">—</p>'}</div>
          <div><h4>${esc(m.away.name)}</h4>${awayList || '<p style="color:var(--muted);font-size:.8rem">—</p>'}</div>
        </div>`;
    }
  }

  /* --- Statistics --- */
  const stats = pickArray(detail, ["statistics", "stats", "matchStats"]);
  if (stats.length) {
    const rows = stats.slice(0, 12).map((s) => {
      const label = val(s, ["name", "type", "label", "stat"]) ?? "—";
      const h = val(s, ["home", "homeValue", "localValue", "home_value"]) ?? "–";
      const a = val(s, ["away", "awayValue", "visitorValue", "away_value"]) ?? "–";
      return `<div class="ev">
        <span class="txt" style="text-align:right">${esc(h)}</span>
        <span style="flex:1;text-align:center;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em">${esc(label)}</span>
        <span class="txt">${esc(a)}</span>
      </div>`;
    }).join("");
    html += `<div class="sec-title">Match stats</div><div class="events">${rows}</div>`;
  }

  return html;
}

/* ============================================================
   14. EVENTS & INIT
   ============================================================ */
function wireEvents() {
  // Search
  let searchTimer;
  $("#searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const v = e.target.value;
    searchTimer = setTimeout(() => {
      state.search = v;
      if (state.view !== "matches") {
        state.view = "matches";
        $$("#viewSeg button").forEach((b) => b.classList.toggle("on", b.dataset.view === "matches"));
        $("#compWrap").hidden = true;
        render();
      } else {
        renderMatches();
      }
    }, 200);
  });

  // Competition select
  $("#compSelect").addEventListener("change", (e) => {
    state.competition = e.target.value;
    if (state.view === "standings") loadStandings();
    else if (state.view === "scorers") loadScorers();
  });

  // Manual refresh
  $("#refreshBtn").addEventListener("click", () => {
    const btn = $("#refreshBtn");
    btn.classList.add("spin");
    setTimeout(() => btn.classList.remove("spin"), 700);
    cache.standings.clear();
    cache.scorers.clear();
    render();
  });

  // Modal close
  $("#modalClose").addEventListener("click", closeModal);
  modalBg.addEventListener("click", (e) => { if (e.target === modalBg) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalBg.classList.contains("open")) closeModal();
  });

  // Pause auto-refresh when tab is hidden
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopAutoRefresh();
    else startAutoRefresh();
  });
}

function startAutoRefresh() {
  stopAutoRefresh();
  state.timer = setInterval(() => {
    if (state.view === "matches" && !document.hidden) loadMatches();
  }, REFRESH_MS);
}
function stopAutoRefresh() {
  if (state.timer) clearInterval(state.timer);
  state.timer = null;
}

function init() {
  $("#yr").textContent = new Date().getFullYear();
  buildSportsNav();
  buildViewSeg();
  syncCompetitionSelect();
  wireEvents();
  render();
  startAutoRefresh();
}

init();
</script>
</body>
</html>
