<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore — Live Sports Scores & Standings</title>
<meta name="description" content="Live scores, standings and fixtures for football, basketball, cricket and tennis.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1a;
  --panel:#111827;
  --panel2:#1a2332;
  --line:#1f2937;
  --text:#e5e7eb;
  --muted:#6b7280;
  --accent:#10b981;
  --blue:#3b82f6;
  --red:#ef4444;
  --amber:#f59e0b;
  --r:12px;
}
html,body{height:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(900px 500px at 10% -10%,#1e3a5f55,transparent 60%),
    radial-gradient(700px 400px at 90% -5%,#14532d55,transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#283548;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a4a63}

/* ============ HEADER ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:#0a0f1ae6;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1200px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;letter-spacing:-.02em;white-space:nowrap}
.brand .mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--blue));
  display:grid;place-items:center;font-size:.9rem;
  box-shadow:0 0 22px #10b98155;
}
.sports{
  display:flex;gap:4px;background:var(--panel);padding:4px;
  border-radius:999px;border:1px solid var(--line);flex-wrap:wrap;
}
.sports button{
  border:0;background:transparent;color:var(--muted);
  font-size:.85rem;font-weight:600;line-height:1;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.16s;
  font-family:inherit;white-space:nowrap;
}
.sports button:hover{color:var(--text);background:#ffffff08}
.sports button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px #2b4a7580 inset}
.sports .ico{font-size:.95rem}

.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted)}
.status .beat{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent);animation:pulse 2s infinite}
.status.warn .beat{background:var(--amber);box-shadow:0 0 9px var(--amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-refresh{
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:1rem;
  display:grid;place-items:center;transition:.15s;font-family:inherit;
}
.btn-refresh:hover{color:var(--text);border-color:#3a5c8f;background:var(--panel2)}
.btn-refresh.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ MAIN ============ */
main{max-width:1200px;margin:0 auto;padding:20px 18px 70px}

.toolbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:18px;
}
.combo{position:relative}
.combo select{
  appearance:none;-webkit-appearance:none;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:10px 36px 10px 14px;border-radius:10px;
  font-size:.86rem;font-weight:600;cursor:pointer;outline:none;
  font-family:inherit;transition:.15s;min-width:200px;
}
.combo select:focus{border-color:#3a5c8f;box-shadow:0 0 0 3px #3b82f622}
.combo::after{
  content:'';position:absolute;right:14px;top:50%;
  width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-70%) rotate(45deg);pointer-events:none;
}

.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:10px}
.seg button{
  border:0;background:transparent;color:var(--muted);
  font-size:.84rem;font-weight:600;padding:8px 14px;border-radius:7px;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel2);color:var(--text)}

/* ============ MATCH GRID ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

.card{
  background:linear-gradient(180deg,var(--panel),#0d1524 90%);
  border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px 12px;transition:transform .18s,border-color .18s,box-shadow .18s;
  position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-2px);border-color:#2f5486;box-shadow:0 12px 30px -10px #000a}
.card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.18s;
}
.card.live::before{background:var(--red)}

.card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.comp{
  flex:1;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip{
  font-size:.66rem;font-weight:800;line-height:1;
  padding:5px 8px;border-radius:6px;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;
}
.chip.done{background:#ffffff0f;color:#93a2ba}
.chip.soon{background:#3b82f61f;color:#60a5fa}
.chip.live{background:#ef444420;color:#f87171;display:inline-flex;align-items:center;gap:5px}
.chip.live i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.3s infinite}

.team{display:flex;align-items:center;gap:10px;padding:5px 0}
.logo{
  width:28px;height:28px;border-radius:50%;flex:none;overflow:hidden;
  background:var(--panel2);display:grid;place-items:center;
  font-size:.65rem;font-weight:800;color:#8ea0bb;
  border:1px solid #22334f;
}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.team .name{flex:1;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.team.win .name,.team.win .sc{color:#fff}
.team.lose .name,.team.lose .sc{color:#7f8ea6}

.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;padding-top:10px;border-top:1px solid #1a2740;
  font-size:.72rem;color:var(--muted);
}

/* ============ TABLE ============ */
.panel{
  background:linear-gradient(180deg,var(--panel),#0d1524);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.panel-head .hint{font-size:.74rem;color:var(--muted);font-weight:500}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:540px}
thead th{
  text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
  padding:11px 14px;background:#0c1524;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
thead th.num,tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody td{padding:11px 14px;border-bottom:1px solid #16223a;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#ffffff06}
td.rank{font-weight:800;color:var(--muted);width:48px}
td.team-cell{display:flex;align-items:center;gap:9px;font-weight:600;min-width:170px}
td.team-cell .logo{width:22px;height:22px;font-size:.58rem}
td.pts{font-weight:800;color:var(--accent)}
.pos-bar{display:inline-block;width:3px;height:16px;border-radius:2px;vertical-align:middle;margin-right:8px;background:transparent}
.pos-ucl{background:var(--blue)}
.pos-uel{background:var(--amber)}
.pos-rel{background:var(--red)}

/* ============ STATES ============ */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:2rem;margin-bottom:12px;opacity:.6}
.empty h3{color:var(--text);font-size:1rem;margin-bottom:6px}
.empty p{font-size:.85rem}

.skel{
  height:150px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(100deg,#111827 30%,#1a2332 50%,#111827 70%);
  background-size:200% 100%;animation:shim 1.3s infinite linear;
}
@keyframes shim{to{background-position:-200% 0}}

/* ============ FOOTER ============ */
footer{border-top:1px solid var(--line);background:#060b14;margin-top:20px}
.foot-inner{
  max-width:1200px;margin:0 auto;padding:26px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.foot-inner p{font-size:.78rem;color:var(--muted);max-width:520px}
.foot-inner a{color:#c7d5ea;text-decoration:none;font-weight:600}
.foot-inner a:hover{color:#fff}
.foot-links{display:flex;gap:18px;font-size:.78rem;flex-wrap:wrap}

/* ============ MOBILE ============ */
@media (max-width:720px){
  .topbar-inner{padding:10px 14px;gap:10px}
  .sports{order:3;width:100%}
  .sports button{flex:1;justify-content:center;padding:9px 6px}
  .sports button .lbl{font-size:.76rem}
  main{padding:16px 14px 60px}
  .grid{grid-template-columns:1fr}
  .foot-inner{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="mark">⚡</div>
      <div>LiveScore</div>
    </div>
    <nav class="sports" id="sportsNav"></nav>
    <div class="spacer"></div>
    <div class="status" id="statusBox">
      <span class="beat"></span>
      <span id="statusText">Loading…</span>
    </div>
    <button class="btn-refresh" id="refreshBtn" title="Refresh" aria-label="Refresh">⟳</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="combo" id="compWrap">
      <select id="compSelect" aria-label="Competition"></select>
    </div>
    <div class="seg" id="viewSeg">
      <button data-view="matches" class="on">Matches</button>
      <button data-view="standings">Standings</button>
    </div>
    <div class="spacer"></div>
  </div>
  <div id="content"></div>
</main>

<footer>
  <div class="foot-inner">
    <p>
      Live scores, standings and fixtures across top competitions.
      Data provided by <a href="https://www.thesportsdb.com/" target="_blank" rel="noopener">TheSportsDB</a>.
    </p>
    <div class="foot-links">
      <a href="https://www.thesportsdb.com/" target="_blank" rel="noopener">TheSportsDB</a>
      <a href="https://www.thesportsdb.com/free_sports_api" target="_blank" rel="noopener">Free API</a>
    </div>
  </div>
</footer>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const API = "https://www.thesportsdb.com/api/v1/json/3";

const SPORTS = {
  football: {
    label: "Football", icon: "⚽",
    leagues: [
      { id: "4328", name: "Premier League" },
      { id: "4335", name: "La Liga" },
      { id: "4332", name: "Serie A" },
      { id: "4331", name: "Bundesliga" },
      { id: "4334", name: "Ligue 1" },
      { id: "4480", name: "Champions League" },
    ]
  },
  basketball: {
    label: "Basketball", icon: "🏀",
    leagues: [
      { id: "4387", name: "NBA" },
    ]
  },
  cricket: {
    label: "Cricket", icon: "🏏",
    leagues: [
      { id: "demo-cricket", name: "IPL (demo)" },
    ]
  },
  tennis: {
    label: "Tennis", icon: "🎾",
    leagues: [
      { id: "demo-tennis", name: "ATP Tour (demo)" },
    ]
  },
};

/* ============================================================
   DEMO DATA (cricket + tennis + fallback)
   ============================================================ */
const now = Date.now();
const mins = (n) => new Date(now + n * 60000).toISOString();

const DEMO = {
  "demo-cricket": [
    { idEvent:"c1", strEvent:"India vs Australia", strHomeTeam:"India", strAwayTeam:"Australia",
      intHomeScore:"245/6", intAwayScore:"210/8", strStatus:"38.4 ov", strLeague:"ICC World Cup",
      dateEvent:new Date(now-190*60000).toISOString().slice(0,10), isLive:true },
    { idEvent:"c2", strEvent:"Mumbai Indians vs Chennai SK", strHomeTeam:"Mumbai Indians", strAwayTeam:"Chennai SK",
      intHomeScore:"188/5", intAwayScore:"172/9", strStatus:"FT", strLeague:"IPL",
      dateEvent:new Date(now-260*60000).toISOString().slice(0,10) },
    { idEvent:"c3", strEvent:"England vs Pakistan", strHomeTeam:"England", strAwayTeam:"Pakistan",
      intHomeScore:"96/2", intAwayScore:"164/7", strStatus:"11.2 ov", strLeague:"T20 World Cup",
      dateEvent:new Date(now-75*60000).toISOString().slice(0,10), isLive:true },
    { idEvent:"c4", strEvent:"RCB vs KKR", strHomeTeam:"RCB", strAwayTeam:"KKR",
      intHomeScore:null, intAwayScore:null, strStatus:null, strLeague:"IPL",
      dateEvent:new Date(now+240*60000).toISOString().slice(0,10), strTime:"19:30:00" },
  ],
  "demo-tennis": [
    { idEvent:"t1", strEvent:"Alcaraz vs Sinner", strHomeTeam:"C. Alcaraz", strAwayTeam:"J. Sinner",
      intHomeScore:"1", intAwayScore:"1", strStatus:"3rd set", strLeague:"ATP Tour",
      dateEvent:new Date(now-105*60000).toISOString().slice(0,10), isLive:true },
    { idEvent:"t2", strEvent:"Djokovic vs Medvedev", strHomeTeam:"N. Djokovic", strAwayTeam:"D. Medvedev",
      intHomeScore:"3", intAwayScore:"1", strStatus:"FT", strLeague:"Grand Slams",
      dateEvent:new Date(now-240*60000).toISOString().slice(0,10) },
    { idEvent:"t3", strEvent:"Swiatek vs Sabalenka", strHomeTeam:"I. Świątek", strAwayTeam:"A. Sabalenka",
      intHomeScore:"1", intAwayScore:"0", strStatus:"2nd set", strLeague:"WTA Tour",
      dateEvent:new Date(now-55*60000).toISOString().slice(0,10), isLive:true },
    { idEvent:"t4", strEvent:"Zverev vs Rune", strHomeTeam:"A. Zverev", strAwayTeam:"H. Rune",
      intHomeScore:null, intAwayScore:null, strStatus:null, strLeague:"ATP Tour",
      dateEvent:new Date(now+180*60000).toISOString().slice(0,10), strTime:"14:00:00" },
  ],
};

const DEMO_STANDINGS = {
  "demo-cricket": [
    { intPosition:1, strTeam:"India", intPlayed:5, intWin:4, intDraw:0, intLoss:1, intPoints:8 },
    { intPosition:2, strTeam:"Australia", intPlayed:5, intWin:3, intDraw:0, intLoss:2, intPoints:6 },
    { intPosition:3, strTeam:"England", intPlayed:5, intWin:3, intDraw:0, intLoss:2, intPoints:6 },
    { intPosition:4, strTeam:"Pakistan", intPlayed:5, intWin:2, intDraw:0, intLoss:3, intPoints:4 },
  ],
  "demo-tennis": [
    { intPosition:1, strTeam:"J. Sinner", intPlayed:22, intWin:20, intDraw:0, intLoss:2, intPoints:11330 },
    { intPosition:2, strTeam:"C. Alcaraz", intPlayed:20, intWin:17, intDraw:0, intLoss:3, intPoints:9850 },
    { intPosition:3, strTeam:"N. Djokovic", intPlayed:18, intWin:15, intDraw:0, intLoss:3, intPoints:8320 },
  ],
};

/* ============================================================
   STATE
   ============================================================ */
const state = {
  sport: "football",
  league: "4328",
  view: "matches",
  loading: false,
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function initials(name) {
  const parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function fmtDate(d) {
  if (!d) return "";
  const date = new Date(d);
  if (isNaN(date)) return "";
  const today = new Date();
  const isToday = date.toDateString() === today.toDateString();
  const tomorrow = new Date(today.getTime() + 86400000);
  const isTomorrow = date.toDateString() === tomorrow.toDateString();
  if (isToday) return "Today";
  if (isTomorrow) return "Tomorrow";
  return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function fmtTime(t) {
  if (!t) return "";
  const [h, m] = String(t).split(":");
  if (!h) return "";
  const d = new Date();
  d.setHours(+h, +(m || 0));
  return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function currentSeason() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const start = m >= 7 ? y : y - 1;
  return `${start}-${start + 1}`;
}

function recentSeasons() {
  const n = new Date();
  const y = n.getFullYear();
  const m = n.getMonth();
  const start = m >= 7 ? y : y - 1;
  return [`${start}-${start + 1}`, `${start - 1}-${start}`, `${start - 2}-${start - 1}`];
}

/* ============================================================
   API
   ============================================================ */
async function fetchJSON(path, params = {}) {
  const url = new URL(`${API}/${path}`);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctrl.signal, headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function loadMatchesForLeague(leagueId) {
  // Demo leagues
  if (leagueId.startsWith("demo-")) {
    return DEMO[leagueId] || [];
  }

  const [past, next] = await Promise.allSettled([
    fetchJSON("eventspastleague.php", { id: leagueId }),
    fetchJSON("eventsnextleague.php", { id: leagueId }),
  ]);

  const pastEvents = past.status === "fulfilled" && past.value?.events ? past.value.events : [];
  const nextEvents = next.status === "fulfilled" && next.value?.events ? next.value.events : [];

  const all = [...pastEvents, ...nextEvents].filter(Boolean);

  // Dedupe by idEvent
  const seen = new Set();
  const dedup = all.filter((e) => {
    if (!e.idEvent || seen.has(e.idEvent)) return false;
    seen.add(e.idEvent);
    return true;
  });

  // Sort: most recent past first, then upcoming by date
  dedup.sort((a, b) => {
    const da = new Date(`${a.dateEvent}T${a.strTime || "00:00:00"}`);
    const db = new Date(`${b.dateEvent}T${b.strTime || "00:00:00"}`);
    return db - da;
  });

  // Take top 20
  return dedup.slice(0, 20);
}

async function loadStandingsForLeague(leagueId) {
  if (leagueId.startsWith("demo-")) {
    return DEMO_STANDINGS[leagueId] || [];
  }

  for (const season of recentSeasons()) {
    try {
      const data = await fetchJSON("lookuptable.php", { l: leagueId, s: season });
      if (data && Array.isArray(data.table) && data.table.length) {
        return data.table;
      }
    } catch (e) {
      // try next season
    }
  }
  return [];
}

/* ============================================================
   NORMALIZERS
   ============================================================ */
function normMatch(e) {
  if (!e) return null;

  const status = String(e.strStatus || "").toLowerCase();
  const isLive = e.isLive === true ||
    /live|in.?play|1st|2nd|half|inning|set\s?\d|q[1-4]|period|break/.test(status);

  const hs = e.intHomeScore;
  const as = e.intAwayScore;
  const hasScore = hs !== null && hs !== undefined && hs !== "" ||
                   as !== null && as !== undefined && as !== "";
  const isFinished = !isLive && hasScore && (status.includes("ft") || status.includes("final") ||
    status === "match finished" || status === "finished" || (!e.strTime && !status));

  const eventDate = e.dateEvent || "";
  const eventTime = e.strTime || "";
  const startTime = eventDate ? `${eventDate}T${eventTime || "00:00:00"}` : null;

  return {
    id: e.idEvent,
    league: e.strLeague || "",
    home: {
      name: e.strHomeTeam || "TBD",
      logo: e.strHomeTeamBadge || null,
      score: hs ?? null,
    },
    away: {
      name: e.strAwayTeam || "TBD",
      logo: e.strAwayTeamBadge || null,
      score: as ?? null,
    },
    isLive,
    isFinished,
    clock: e.strStatus || (isFinished ? "FT" : null),
    startTime,
    raw: e,
  };
}

function normStanding(r) {
  return {
    pos: r.intPosition ?? r.position ?? 0,
    team: r.strTeam ?? "—",
    logo: r.strTeamBadge ?? r.strBadge ?? null,
    played: r.intPlayed ?? "–",
    win: r.intWin ?? "–",
    draw: r.intDraw ?? "–",
    loss: r.intLoss ?? "–",
    gd: r.intGoalDifference ?? "–",
    pts: r.intPoints ?? "–",
  };
}

/* ============================================================
   RENDER — MATCHES
   ============================================================ */
function logoHTML(team) {
  if (team.logo) {
    return `<span class="logo"><img src="${esc(team.logo)}" alt="" loading="lazy"
              onerror="this.parentNode.textContent='${esc(initials(team.name))}'"></span>`;
  }
  return `<span class="logo">${esc(initials(team.name))}</span>`;
}

function statusChip(m) {
  if (m.isLive) return `<span class="chip live"><i></i>${esc(m.clock || "LIVE")}</span>`;
  if (m.isFinished) return `<span class="chip done">FT</span>`;
  const d = m.startTime ? new Date(m.startTime) : null;
  if (!d || isNaN(d)) return `<span class="chip soon">TBD</span>`;
  const isToday = d.toDateString() === new Date().toDateString();
  if (isToday) return `<span class="chip soon">${esc(fmtTime(m.raw.strTime || ""))}</span>`;
  return `<span class="chip soon">${esc(fmtDate(m.startTime))}</span>`;
}

function matchCardHTML(m) {
  const hs = m.home.score;
  const as = m.away.score;
  const hasScore = hs != null || as != null;
  const homeWin = m.isFinished && hasScore && Number(hs) > Number(as);
  const awayWin = m.isFinished && hasScore && Number(as) > Number(hs);

  return `
  <article class="card ${m.isLive ? "live" : ""}">
    <div class="card-top">
      <span class="comp">${esc(m.league)}</span>
      ${statusChip(m)}
    </div>

    <div class="team ${homeWin ? "win" : awayWin ? "lose" : ""}">
      ${logoHTML(m.home)}
      <span class="name">${esc(m.home.name)}</span>
      <span class="sc">${hs != null ? esc(hs) : "–"}</span>
    </div>

    <div class="team ${awayWin ? "win" : homeWin ? "lose" : ""}">
      ${logoHTML(m.away)}
      <span class="name">${esc(m.away.name)}</span>
      <span class="sc">${as != null ? esc(as) : "–"}</span>
    </div>

    <div class="card-foot">
      <span>${esc(m.isLive ? "In progress" : m.isFinished ? "Full time" : fmtDate(m.startTime))}</span>
      ${m.isFinished && hasScore ? `<span>${esc(hs)} – ${esc(as)}</span>` : ""}
    </div>
  </article>`;
}

function renderMatches(matches, leagueName) {
  const box = $("#content");

  if (!matches || !matches.length) {
    box.innerHTML = `
      <div class="panel">
        <div class="panel-head"><h2>${esc(leagueName)}</h2></div>
        <div class="empty">
          <div class="big">⚽</div>
          <h3>No matches available</h3>
          <p>This league has no fixtures to show right now.</p>
        </div>
      </div>`;
    return;
  }

  box.innerHTML = `<div class="grid">${matches.map(matchCardHTML).join("")}</div>`;
}

/* ============================================================
   RENDER — STANDINGS
   ============================================================ */
function renderStandings(rows, leagueName) {
  const box = $("#content");

  if (!rows || !rows.length) {
    box.innerHTML = `
      <div class="panel">
        <div class="panel-head"><h2>${esc(leagueName)} — Standings</h2></div>
        <div class="empty">
          <div class="big">📊</div>
          <h3>No standings available</h3>
          <p>Standings data for this competition isn't available right now.</p>
        </div>
      </div>`;
    return;
  }

  const body = rows.map((r) => {
    const s = normStanding(r);
    const bar = s.pos <= 4 ? "pos-ucl" : s.pos <= 6 ? "pos-uel" : (rows.length - s.pos < 3 ? "pos-rel" : "");
    const logoHTML2 = s.logo
      ? `<span class="logo"><img src="${esc(s.logo)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${esc(initials(s.team))}'"></span>`
      : `<span class="logo">${esc(initials(s.team))}</span>`;
    return `<tr>
      <td class="rank"><span class="pos-bar ${bar}"></span>${esc(s.pos)}</td>
      <td><div class="team-cell">${logoHTML2}<span>${esc(s.team)}</span></div></td>
      <td class="num">${esc(s.played)}</td>
      <td class="num">${esc(s.win)}</td>
      <td class="num">${esc(s.draw)}</td>
      <td class="num">${esc(s.loss)}</td>
      <td class="num">${esc(s.gd)}</td>
      <td class="num pts">${esc(s.pts)}</td>
    </tr>`;
  }).join("");

  box.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>${esc(leagueName)}</h2><span class="hint">Standings</span></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Team</th>
            <th class="num">P</th><th class="num">W</th><th class="num">D</th>
            <th class="num">L</th><th class="num">GD</th><th class="num">Pts</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

/* ============================================================
   LOADERS
   ============================================================ */
async function load() {
  const sport = SPORTS[state.sport];
  const league = sport.leagues.find((l) => l.id === state.league) || sport.leagues[0];
  if (!league) return;

  state.loading = true;
  showSkeletons();
  setStatus("Loading…");

  try {
    if (state.view === "matches") {
      const matches = await loadMatchesForLeague(league.id);
      const normalized = matches.map(normMatch).filter(Boolean);
      renderMatches(normalized, league.name);
      setStatus(`Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
    } else {
      const rows = await loadStandingsForLeague(league.id);
      renderStandings(rows, league.name);
      setStatus(`Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
    }
  } catch (err) {
    console.error(err);
    setStatus("Couldn't load data", true);
    $("#content").innerHTML = `
      <div class="panel">
        <div class="empty">
          <div class="big">⚠️</div>
          <h3>Couldn't load data</h3>
          <p>Please check your internet connection and try refreshing.</p>
        </div>
      </div>`;
  } finally {
    state.loading = false;
  }
}

function showSkeletons() {
  const count = state.view === "matches" ? 6 : 1;
  if (state.view === "matches") {
    $("#content").innerHTML = `<div class="grid">${'<div class="skel"></div>'.repeat(count)}</div>`;
  } else {
    $("#content").innerHTML = `<div class="panel"><div style="padding:16px">${'<div class="skel" style="height:44px;margin-bottom:8px"></div>'.repeat(8)}</div></div>`;
  }
}

function setStatus(text, warn = false) {
  $("#statusText").textContent = text;
  $("#statusBox").classList.toggle("warn", warn);
}

/* ============================================================
   UI BUILD
   ============================================================ */
function buildSportsNav() {
  const nav = $("#sportsNav");
  nav.innerHTML = Object.entries(SPORTS).map(([id, s]) => `
    <button data-sport="${id}" class="${id === state.sport ? "on" : ""}">
      <span class="ico">${s.icon}</span><span class="lbl">${s.label}</span>
    </button>`).join("");

  nav.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-sport]");
    if (!btn || btn.dataset.sport === state.sport) return;
    state.sport = btn.dataset.sport;
    const leagues = SPORTS[state.sport].leagues;
    state.league = leagues[0]?.id || "";
    $$("#sportsNav button").forEach((b) => b.classList.toggle("on", b === btn));
    syncLeagueSelect();
    load();
  });
}

function syncLeagueSelect() {
  const leagues = SPORTS[state.sport].leagues;
  const sel = $("#compSelect");
  sel.innerHTML = leagues.map((l) =>
    `<option value="${l.id}" ${l.id === state.league ? "selected" : ""}>${esc(l.name)}</option>`
  ).join("");
}

function buildViewSeg() {
  $("#viewSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if (!btn || btn.dataset.view === state.view) return;
    state.view = btn.dataset.view;
    $$("#viewSeg button").forEach((b) => b.classList.toggle("on", b === btn));
    load();
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
function wireEvents() {
  $("#compSelect").addEventListener("change", (e) => {
    state.league = e.target.value;
    load();
  });

  $("#refreshBtn").addEventListener("click", () => {
    const btn = $("#refreshBtn");
    btn.classList.add("spin");
    setTimeout(() => btn.classList.remove("spin"), 700);
    load();
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  buildSportsNav();
  syncLeagueSelect();
  buildViewSeg();
  wireEvents();
  load();

  // Auto-refresh every 60s (only matches view)
  setInterval(() => {
    if (state.view === "matches" && !document.hidden) load();
  }, 60000);
}

init();
</script>
</body>
</html>
